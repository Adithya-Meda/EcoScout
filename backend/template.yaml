AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EcoScout backend — API Gateway REST, Lambda, S3, Rekognition, Gemini API

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://main.d6skx41fd3ndo.amplifyapp.com
    Description: Exact browser origin allowed by CORS (Amplify frontend URL). Do not use *.
    AllowedPattern: ^https?://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+$
    ConstraintDescription: Must be a full http(s) origin with no wildcard.

  GeminiModelId:
    Type: String
    Default: gemini-3.5-flash-lite
    Description: Gemini API model for recycling advice.

  GeminiApiKeySecretName:
    Type: String
    Default: ecoscout/gemini-api-key
    Description: Name of the Secrets Manager secret containing the Gemini API key.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 29
    MemorySize: 512
    Tracing: Active
    Architectures:
      - x86_64

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTempUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Application
          Value: EcoScout
        - Key: DataClass
          Value: TemporaryUploads

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub ${UploadBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  EcoScoutApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ecoscout-api
      StageName: prod
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
          MetricsEnabled: true
      Cors:
        AllowMethods: "'OPTIONS,POST'"
        AllowHeaders: "'Content-Type,X-Api-Key,x-api-key'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,x-api-key'"
              Access-Control-Allow-Methods: "'OPTIONS,POST'"
              X-Content-Type-Options: "'nosniff'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,x-api-key'"
              Access-Control-Allow-Methods: "'OPTIONS,POST'"
              X-Content-Type-Options: "'nosniff'"

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ecoscout-analyze
      CodeUri: src/
      Handler: handler.handler
      Description: Validate upload, Rekognition labels, Gemini recycling advice
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          GEMINI_MODEL_ID: !Ref GeminiModelId
          GEMINI_API_KEY_SECRET_ID: !Ref GeminiApiKeySecretName
      Events:
        Analyze:
          Type: Api
          Properties:
            RestApiId: !Ref EcoScoutApi
            Path: /analyze
            Method: POST
      Policies:
        - Statement:
            - Sid: TempUploadObjects
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub ${UploadBucket.Arn}/uploads/*
            - Sid: DetectLabels
              Effect: Allow
              Action:
                - rekognition:DetectLabels
              Resource: "*"
            - Sid: ReadGeminiApiKey
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GeminiApiKeySecretName}-*
            - Sid: FunctionLogs
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ecoscout-analyze:*
            - Sid: XRay
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"

Outputs:
  ApiUrl:
    Description: Analyze endpoint
    Value: !Sub https://${EcoScoutApi}.execute-api.${AWS::Region}.amazonaws.com/prod/analyze

  ApiId:
    Description: REST API id
    Value: !Ref EcoScoutApi

  UploadBucketName:
    Description: Temporary encrypted upload bucket
    Value: !Ref UploadBucket
